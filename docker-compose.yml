services:
  notification-registry-smoke:
    build:
      context: .
      args:
        ARTIFACTORY_USER: "__token__"
        ARTIFACTORY_PWD: ${GROUP_TOKEN}
    image: ${DOCKER_IMAGE}
    container_name: notification-registry-smoke
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - python -c "import notification_registry; print('notification-registry import ok')"

networks:
  default:
    external: true
    name: ${CONTAINER_NETWORK}
