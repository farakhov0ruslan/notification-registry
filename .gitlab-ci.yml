workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_train"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never

include:
  - project: 'sales-trigger/sdk/gitlab-ci-cd'
    file: '.prepare-gitlab-ci.yml'
    ref: 'main'
  - project: 'sales-trigger/sdk/gitlab-ci-cd'
    file: '.uv-gitlab-ci.yml'
    ref: 'main'
  - project: 'sales-trigger/sdk/gitlab-ci-cd'
    file: '.build-gitlab-ci.yml'
    ref: 'main'
  - project: 'sales-trigger/sdk/gitlab-ci-cd'
    file: '.test-gitlab-ci.yml'
    ref: 'main'

stages:
  - prepare
  - build-and-push
  - test

